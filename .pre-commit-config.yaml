repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        files: '^terraform/workspaces/'
  - repo: local
    hooks:
      - id: checkov-cis-gate
        name: Checkov CIS-aligned gate (S3 templates)
        entry: checkov -d agent/templates --framework terraform --compact --skip-download
        language: system
        pass_filenames: false
        files: '^agent/templates/.*\.tf\.j2$'
