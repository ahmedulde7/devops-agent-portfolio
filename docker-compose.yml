services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pulls the model, then exits. `docker compose up` will show it
  # as "exited (0)" when done -- that's success, not a crash.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.1}"]

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  agent:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      AGENT_LLM_BACKEND: ollama
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1}"
      AWS_ENDPOINT_URL: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      TERRAFORM_BIN: terraform
    volumes:
      - ./terraform/workspaces:/app/terraform/workspaces
      - ./agent/cis_mapping.yaml:/app/agent/cis_mapping.yaml:ro

volumes:
  ollama_data:
  localstack_data:
