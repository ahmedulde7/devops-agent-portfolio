apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: devops-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: devops-agent
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "4", memory: "8Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: devops-agent
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
---
# One-shot Job that pulls the model into the PVC above. Re-run with:
#   kubectl -n devops-agent delete job ollama-pull --ignore-not-found
#   kubectl apply -f k3s/ollama.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull
  namespace: devops-agent
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ollama-pull
          image: curlimages/curl:8.8.0
          env:
            - name: OLLAMA_MODEL
              value: "llama3.1"
          command:
            - sh
            - -c
            - >
              until curl -sf http://ollama:11434/api/tags; do echo waiting for ollama; sleep 3; done;
              curl -sf http://ollama:11434/api/pull -d "{\"name\": \"$OLLAMA_MODEL\"}"
